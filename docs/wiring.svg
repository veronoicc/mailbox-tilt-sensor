<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="14" fill="none" stroke="#24292f" stroke-width="2">
  <style>@media (prefers-color-scheme: dark) {[stroke="#0969da"]{stroke:#58a6ff} [fill="#0969da"]{fill:#58a6ff} [stroke="#8c959f"]{stroke:#6e7781} [fill="#8c959f"]{fill:#6e7781} [stroke="#8250df"]{stroke:#d2a8ff} [fill="#8250df"]{fill:#d2a8ff} [stroke="#bf3989"]{stroke:#ff9bce} [fill="#bf3989"]{fill:#ff9bce} [stroke="#bc4c00"]{stroke:#ffa657} [fill="#bc4c00"]{fill:#ffa657} [stroke="#0550ae"]{stroke:#79c0ff} [fill="#0550ae"]{fill:#79c0ff} [stroke="#1b7c83"]{stroke:#56d4dd} [fill="#1b7c83"]{fill:#56d4dd} [stroke="#cf222e"]{stroke:#ff7b72} [fill="#cf222e"]{fill:#ff7b72} [stroke="#24292f"]{stroke:#e6edf3} [fill="#24292f"]{fill:#e6edf3} [stroke="#6e7781"]{stroke:#8b949e} [fill="#6e7781"]{fill:#8b949e} [stroke="#f6f8fa"]{stroke:#161b22} [fill="#f6f8fa"]{fill:#161b22} [stroke="#9a6700"]{stroke:#d29922} [fill="#9a6700"]{fill:#d29922} [stroke="#24292f"]{stroke:#e6edf3}}</style>
  <!-- Battery + cap -->
  <rect x="30" y="50" width="150" height="100" rx="8" stroke="#8c959f" fill="#f6f8fa"/>
  <text x="105" y="95" text-anchor="middle" fill="#24292f" stroke="none">CR123A</text>
  <text x="105" y="115" text-anchor="middle" fill="#6e7781" stroke="none">3.0 V Li-MnO₂</text>
  <text x="192" y="66" fill="#cf222e" stroke="none">+</text>
  <text x="192" y="136" fill="#24292f" stroke="none">−</text>
  <rect x="225" y="88" width="70" height="34" rx="4" stroke="#bc4c00" fill="#f6f8fa"/>
  <text x="260" y="110" text-anchor="middle" fill="#24292f" stroke="none">100 µF</text>
  <!-- rails -->
  <path d="M180 70 H360" stroke="#cf222e"/>
  <path d="M180 130 H360"/>
  <path d="M260 70 V88" stroke="#cf222e"/>
  <path d="M260 122 V130"/>
  <text x="270" y="62" fill="#cf222e" stroke="none">3V3 rail</text>
  <text x="270" y="148" fill="#6e7781" stroke="none">GND rail</text>
  <!-- XIAO -->
  <rect x="360" y="30" width="240" height="190" rx="10" stroke="#0969da" fill="#f6f8fa"/>
  <text x="480" y="60" text-anchor="middle" fill="#24292f" stroke="none" font-weight="bold">Seeed XIAO nRF52840</text>
  <text x="372" y="74" fill="#cf222e" stroke="none" font-size="12">3V3</text>
  <text x="372" y="134" fill="#24292f" stroke="none" font-size="12">GND</text>
  <text x="480" y="200" text-anchor="middle" fill="#6e7781" stroke="none" font-size="12">DC-DC on, System-Off wake on D0</text>
  <!-- XIAO right pins -->
  <path d="M600 70 H740" stroke="#cf222e"/>
  <path d="M600 100 H740"/>
  <path d="M600 130 H740" stroke="#8250df"/>
  <path d="M600 160 H740" stroke="#bf3989"/>
  <path d="M600 190 H740" stroke="#0550ae"/>
  <g fill="#24292f" stroke="none" font-size="12" text-anchor="end">
    <text x="592" y="74">3V3</text>
    <text x="592" y="104">GND</text>
    <text x="592" y="134">D4 SDA</text>
    <text x="592" y="164">D5 SCL</text>
    <text x="592" y="194">D0 INT1</text>
  </g>
  <!-- hinge -->
  <path d="M670 20 V215" stroke="#9a6700" stroke-dasharray="6 5"/>
  <text x="670" y="14" text-anchor="middle" fill="#9a6700" stroke="none" font-size="12">hinge · 5-wire service loop</text>
  <!-- LIS3DH -->
  <rect x="740" y="50" width="140" height="160" rx="8" stroke="#8c959f" fill="#f6f8fa"/>
  <text x="810" y="100" text-anchor="middle" fill="#24292f" stroke="none">LIS3DH</text>
  <text x="810" y="120" text-anchor="middle" fill="#6e7781" stroke="none">I²C 0x19</text>
  <text x="810" y="140" text-anchor="middle" fill="#6e7781" stroke="none">flap pod</text>
  <!-- Wio -->
  <path d="M480 220 V270"/>
  <rect x="360" y="270" width="240" height="90" rx="8" stroke="#1b7c83" fill="#f6f8fa"/>
  <text x="480" y="300" text-anchor="middle" fill="#24292f" stroke="none">Wio-SX1262 (stacked)</text>
  <text x="480" y="322" text-anchor="middle" fill="#6e7781" stroke="none" font-size="12">SPI D8 / D9 / D10 · CS D1</text>
  <text x="480" y="340" text-anchor="middle" fill="#6e7781" stroke="none" font-size="12">RST D2 · BUSY D3 · DIO1 D6 · U.FL 868 MHz</text>
  <!-- warning -->
  <text x="30" y="400" fill="#cf222e" stroke="none">Never connect USB while the CR123A is on 3V3.</text>
</svg>
