; Mailbox tilt sensor
;   pio run                       release firmware, no serial logging (default)
;   pio run -e debug -t upload    bench firmware with serial logging @ 115200
;   pio test -e native            host unit tests (uplink encoder, hex key parser, command parser, heartbeat policy, retry policy, BLE frame encoder)

[platformio]
default_envs = release

[firmware]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#a6fd41debbbcda13b5340fff50c9092ed3289194
board = seeed-xiao-afruitnrf52-nrf52840
framework = arduino
monitor_speed = 115200
lib_deps = jgromes/RadioLib @ ^6.6.0
; Common nRF52 setting so library weak symbols/ISRs link; keep until verified on hardware.
lib_archive = no

[env:release]
extends = firmware
build_flags = -D DEBUG_SERIAL=0

[env:debug]
extends = firmware
build_flags = -D DEBUG_SERIAL=1 -D RADIOLIB_DEBUG_BASIC=1 -D RADIOLIB_DEBUG_PROTOCOL=1

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<lora/uplink.cpp> +<lora/hex_key.cpp> +<cmd/cmd_parse.cpp> +<core/heartbeat_policy.cpp> +<core/retry_policy.cpp> +<ble/proto.cpp>
